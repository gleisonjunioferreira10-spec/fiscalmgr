databases:
  - name: gerente-fiscal-db
    plan: free
    databaseName: gerente_fiscal
    user: gerente_fiscal

services:
  - type: web
    name: gerente-fiscal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gerente-fiscal-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: gerente-fiscal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://gerente-fiscal-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
